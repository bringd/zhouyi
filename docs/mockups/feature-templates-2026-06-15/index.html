<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>4 套候选样例</title>
<style>
  body {
    margin: 0; padding: 32px;
    background: #F4E9D2;
    font-family: "LXGW WenKai", "霞鹜文楷", serif;
    color: #1A1A1A;
  }
  h1 { text-align: center; font-family: "Noto Serif SC", serif; letter-spacing: 0.3em; }
  .intro { max-width: 720px; margin: 0 auto 32px; line-height: 1.8; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; max-width: 1200px; margin: 0 auto;
  }
  .card {
    background: white; border: 1px solid #8B6914;
    border-radius: 8px; padding: 20px;
  }
  .card h2 {
    margin: 0 0 6px; font-family: "Noto Serif SC", serif;
    font-size: 18px; color: #9B2C2C;
  }
  .card p { margin: 0 0 12px; font-size: 13px; color: #4A371C; }
  .card a {
    display: inline-block; margin-top: 8px;
    padding: 8px 18px; background: #9B2C2C; color: #FAF6EC;
    text-decoration: none; border-radius: 4px;
    font-family: "Noto Serif SC", serif; font-size: 13px;
  }
  .card a:hover { background: #7a1f1f; }
</style>
</head>
<body>
  <h1>4 套样例</h1>
  <p class="intro">
    这是为"卦象结果页 + 分享卡"功能设计的 4 个候选视觉。
    在浏览器里点开每个 iframe 单独看全屏效果最佳。
    选完告诉我编号（① / ② / A / B）。
  </p>
  <div class="grid">
    <div class="card">
      <h2>① 卜卦结果页 · 纵列分层</h2>
      <p>本卦视觉+信息左右分栏，AI 单独一层，感言独立。信息密度高。</p>
      <a href="result-page-option-1.html" target="_blank">打开全屏预览 →</a>
    </div>
    <div class="card">
      <h2>② 卜卦结果页 · Hero 卡</h2>
      <p>卦象超大居中，气势强。视觉冲击大但文字密度低。</p>
      <a href="result-page-option-2.html" target="_blank">打开全屏预览 →</a>
    </div>
    <div class="card">
      <h2>A 分享 标签 · 横向</h2>
      <p>左卦象+右文字，像聊天卡片。适合 IM 分享。</p>
      <a href="share-card-option-a.html" target="_blank">打开全屏预览 →</a>
    </div>
    <div class="card">
      <h2>B 分享 标签 · 纵向</h2>
      <p>竖向书签样式，适合截图保存 + 二维码。</p>
      <a href="share-card-option-b.html" target="_blank">打开全屏预览 →</a>
    </div>
  </div>
</body>
</html>
