<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>卜卦结果页 · 方案 ② Hero 卡</title>
<style>
  :root {
    --color-rice: #FAF6EC;
    --color-rice-dark: #EDE2D0;
    --color-june-red: #9B2C2C;
    --color-june-gold: #C89E3A;
    --color-june-bronze: #8B6914;
    --color-june-clay: #6B4A2A;
    --color-ink: #1A1A1A;
    --color-ink-light: #4A371C;
    --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
    --font-body: "LXGW WenKai", "霞鹜文楷", "KaiTi", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: linear-gradient(180deg, #F4E9D2 0%, #E6D5B0 100%);
    font-family: var(--font-body); color: var(--color-ink);
    min-height: 100vh;
  }
  .mockup-label {
    position: fixed; top: 12px; right: 12px;
    background: var(--color-june-red); color: var(--color-rice);
    padding: 6px 14px; border-radius: 999px;
    font-family: var(--font-display); font-size: 12px;
    letter-spacing: 0.1em; z-index: 100;
  }
  .page {
    max-width: 720px; margin: 0 auto;
    background: var(--color-rice);
    border: 2px solid var(--color-june-bronze);
    border-radius: 8px;
    padding: 28px;
    box-shadow: 0 4px 24px rgba(74,55,28,0.15);
  }
  /* HERO 块 */
  .hero {
    position: relative;
    background: linear-gradient(135deg, var(--color-june-red) 0%, var(--color-june-clay) 100%);
    color: var(--color-rice);
    border-radius: 6px;
    padding: 40px 24px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(155,44,44,0.3);
  }
  .hero-hex {
    width: 120px; height: 140px; margin: 0 auto 16px;
  }
  .hero h2 {
    font-family: var(--font-display);
    font-size: 36px; letter-spacing: 0.4em;
    margin: 0 0 12px; font-weight: 500;
  }
  .hero .meta {
    font-size: 13px; opacity: 0.85;
    letter-spacing: 0.15em;
  }
  .hero .meta strong { font-size: 16px; }

  /* 卡片 */
  .card {
    background: var(--color-rice-dark);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .card .label {
    font-family: var(--font-display);
    font-size: 11px; color: var(--color-june-bronze);
    letter-spacing: 0.3em; margin-bottom: 6px;
  }
  .card .value {
    font-size: 16px; color: var(--color-ink);
  }
  .card .value strong { color: var(--color-june-red); }

  .ai-text {
    font-size: 14px; line-height: 1.8; margin: 0 0 8px;
  }
  .ai-link {
    font-size: 12px; color: var(--color-june-red); cursor: pointer;
  }
  .note-row {
    display: flex; gap: 8px; align-items: flex-start;
  }
  .note-input {
    flex: 1; min-height: 50px; padding: 8px 10px;
    font-family: var(--font-body); font-size: 14px;
    background: white; border: 1px solid var(--color-june-bronze)/40;
    border-radius: 4px; resize: vertical;
  }
  .save-btn {
    padding: 6px 16px; background: var(--color-june-bronze);
    color: var(--color-rice); border: none; border-radius: 4px;
    font-family: var(--font-display); font-size: 12px; cursor: pointer;
  }
  .actions {
    display: flex; justify-content: center; gap: 12px;
    padding-top: 16px;
  }
  .action-btn {
    padding: 10px 22px; font-family: var(--font-display);
    font-size: 14px; letter-spacing: 0.2em;
    border-radius: 4px; cursor: pointer;
    border: 1px solid var(--color-june-bronze);
  }
  .action-btn.primary {
    background: var(--color-june-red); color: var(--color-rice); border-color: var(--color-june-red);
  }
  .action-btn.secondary {
    background: var(--color-rice); color: var(--color-ink);
  }
  .heart { color: var(--color-june-red); }
</style>
</head>
<body>
  <div class="mockup-label">方案 ② Hero 卡</div>

  <div class="page">
    <!-- HERO -->
    <div class="hero">
      <svg class="hero-hex" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <g stroke="var(--color-rice)" stroke-width="6" stroke-linecap="round">
          <line x1="15" y1="15" x2="85" y2="15"/>
          <line x1="15" y1="33" x2="85" y2="33"/>
          <line x1="15" y1="51" x2="85" y2="51"/>
          <line x1="15" y1="69" x2="85" y2="69"/>
          <line x1="15" y1="87" x2="85" y2="87"/>
          <line x1="15" y1="105" x2="85" y2="105"/>
        </g>
      </svg>
      <h2>乾 为 天</h2>
      <div class="meta">2026-06-15 14:30  ·  动 <strong>3</strong> 爻</div>
    </div>

    <!-- 本→变 -->
    <div class="card">
      <div class="label">本 卦 → 变 卦</div>
      <div class="value">乾为天 <span style="color: var(--color-june-red); margin: 0 8px;">→</span> 天风姤</div>
    </div>

    <!-- AI 解读 -->
    <div class="card">
      <div class="label">AI 解读 · 简易版</div>
      <p class="ai-text">乾卦纯阳之象，象征刚健中正。当前你处于事业上升期，行动力强，宜主动出击、把握先机。但刚易折，需防过刚易断。</p>
      <a class="ai-link">查看完整 6 段解读 ▸</a>
    </div>

    <!-- 感言 -->
    <div class="card">
      <div class="label">感 言</div>
      <div class="note-row">
        <textarea class="note-input">今日问事业，乾卦三爻动，正合我心。</textarea>
        <button class="save-btn">保存</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="action-btn primary"><span class="heart">♡</span> 收藏本卦</button>
      <button class="action-btn secondary">↗ 分享</button>
    </div>
  </div>
</body>
</html>
